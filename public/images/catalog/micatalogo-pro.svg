<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">MiCatalogo Pro</title>
  <desc id="desc">Panel de catalogo digital con productos, estadisticas y contacto por WhatsApp.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="56" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="160" fill="#ffffff" opacity="0.12"/>
  <circle cx="170" cy="760" r="210" fill="#ffffff" opacity="0.10"/>
  <g filter="url(#shadow)">
    <rect x="150" y="120" width="900" height="610" rx="34" fill="#f8fafc"/>
    <rect x="150" y="120" width="900" height="78" rx="34" fill="#0f172a"/>
    <circle cx="200" cy="159" r="11" fill="#ef4444"/>
    <circle cx="232" cy="159" r="11" fill="#f59e0b"/>
    <circle cx="264" cy="159" r="11" fill="#22c55e"/>
    <rect x="810" y="145" width="180" height="28" rx="14" fill="#2563eb"/>
    <text x="190" y="262" fill="#0f172a" font-family="Arial, sans-serif" font-size="46" font-weight="800">MiCatalogo Pro</text>
    <text x="190" y="309" fill="#475569" font-family="Arial, sans-serif" font-size="24">Tu catalogo listo para vender por WhatsApp</text>
    <rect x="190" y="360" width="250" height="230" rx="26" fill="url(#card)"/>
    <rect x="475" y="360" width="250" height="230" rx="26" fill="#ecfdf5"/>
    <rect x="760" y="360" width="250" height="230" rx="26" fill="#fff7ed"/>
    <rect x="220" y="395" width="190" height="95" rx="20" fill="#2563eb"/>
    <rect x="505" y="395" width="190" height="95" rx="20" fill="#16a34a"/>
    <rect x="790" y="395" width="190" height="95" rx="20" fill="#f97316"/>
    <text x="220" y="535" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Productos</text>
    <text x="505" y="535" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">WhatsApp</text>
    <text x="790" y="535" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Pedidos</text>
    <rect x="190" y="625" width="545" height="48" rx="24" fill="#e2e8f0"/>
    <rect x="780" y="625" width="230" height="48" rx="24" fill="#22c55e"/>
    <text x="824" y="657" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="800">Compartir</text>
  </g>
</svg>
